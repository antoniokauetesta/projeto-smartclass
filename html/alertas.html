<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alertas de Temperatura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">SmartClass</p>
            <h1>Climate</h1>
          </div>
        </div>

        <nav class="nav">
          <a class="nav-item" href="home.html"><span>Dashboard</span></a>
          <a class="nav-item" href="historico.html"><span>Histórico</span></a>
          <a class="nav-item active" href="alertas.html"><span>Alertas</span></a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Monitoramento</p>
            <h2>Alertas e eventos</h2>
          </div>
        </header>

        <section class="stats-grid">
          <article class="stat-card">
            <p>Acima de 28°C</p>
            <div class="stat-value small">
              <span>03</span>
              <small>eventos</small>
            </div>
          </article>

          <article class="stat-card">
            <p>Próximo do limite</p>
            <div class="stat-value small">
              <span>02</span>
              <small>avisos</small>
            </div>
          </article>

          <article class="stat-card">
            <p>Último alerta</p>
            <div class="stat-value small">
              <span>08:35</span>
            </div>
          </article>

          <article class="stat-card">
            <p>Status</p>
            <div class="stat-value small">
              <span>Normal</span>
            </div>
          </article>
        </section>

        <section class="chart-card table-card">
          <div class="card-header">
            <div>
              <p class="eyebrow">Lista</p>
              <h3>Eventos recentes</h3>
            </div>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>Hora</th>
                <th>Temperatura</th>
                <th>Nível</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="alertTable"></tbody>
          </table>
        </section>
      </main>
    </div>

<script src="../js/script.js"></script>
  </body>
</html>
