<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Histórico de Temperatura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">SmartClass</p>
            <h1>Climate</h1>
          </div>
        </div>

        <nav class="nav">
          <a class="nav-item" href="home.html"><span>Dashboard</span></a>
          <a class="nav-item active" href="historico.html"><span>Histórico</span></a>
          <a class="nav-item" href="alertas.html"><span>Alertas</span></a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Registro</p>
            <h2>Histórico de temperatura</h2>
          </div>
        </header>

        <section class="stats-grid">
          <article class="stat-card">
            <p>Últimas 24h</p>
            <div class="stat-value small">
              <span>42</span>
              <small>leituras</small>
            </div>
          </article>

          <article class="stat-card">
            <p>Média</p>
            <div class="stat-value small">
              <span>24.7</span>
              <small>°C</small>
            </div>
          </article>

          <article class="stat-card">
            <p>Pico</p>
            <div class="stat-value small">
              <span>29.4</span>
              <small>°C</small>
            </div>
          </article>

          <article class="stat-card">
            <p>Estabilidade</p>
            <div class="stat-value small">
              <span>92%</span>
            </div>
          </article>
        </section>

        <section class="chart-card history-card">
          <div class="card-header">
            <div>
              <p class="eyebrow">Evolução</p>
              <h3>Temperaturas recentes</h3>
            </div>
          </div>

          <div id="historyChart" class="history-chart" aria-label="gráfico de histórico"></div>
        </section>

        <section class="chart-card table-card">
          <div class="card-header">
            <div>
              <p class="eyebrow">Detalhes</p>
              <h3>Últimos registros</h3>
            </div>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>Hora</th>
                <th>Temperatura</th>
                <th>Situação</th>
              </tr>
            </thead>
            <tbody id="historyTable"></tbody>
          </table>
        </section>
      </main>
    </div>

<script src="../js/script.js"></script>
  </body>
</html>
