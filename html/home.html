<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Temperatura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">SmartClass</p>
            <h1>Climate</h1>
          </div>
        </div>

        <nav class="nav">
          <a class="nav-item active" href="home.html">
            <span>Dashboard</span>
          </a>
          <a class="nav-item" href="historico.html">
            <span>Histórico</span>
          </a>
          <a class="nav-item" href="alertas.html">
            <span>Alertas</span>
          </a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Monitoramento em tempo real</p>
            <h2>Temperatura ambiente</h2>
          </div>
          <button id="connectBtn" class="primary-btn">Conectar Arduino</button>
        </header>

        <section class="stats-grid">
          <article class="stat-card accent">
            <p>Temperatura atual</p>
            <div class="stat-value">
              <span id="temperatureValue">24.0</span>
              <small>°C</small>
            </div>
            <span id="statusLabel" class="status-pill ok">Estável</span>
          </article>

          <article class="stat-card">
            <p>Temperatura mínima</p>
            <div class="stat-value small">
              <span id="minValue">19.8</span>
              <small>°C</small>
            </div>
          </article>

          <article class="stat-card">
            <p>Temperatura máxima</p>
            <div class="stat-value small">
              <span id="maxValue">29.1</span>
              <small>°C</small>
            </div>
          </article>

          <article class="stat-card">
            <p>Leitura do sensor</p>
            <div class="stat-value small">
              <span id="sensorState">Online</span>
            </div>
          </article>
        </section>

        <section class="chart-card">
          <div class="card-header">
            <div>
              <p class="eyebrow">Evolução</p>
              <h3>Últimas medições</h3>
            </div>
            <span class="live-dot">
              <span class="pulse"></span>
              Ao vivo
            </span>
          </div>

          <canvas id="temperatureChart" width="900" height="260"></canvas>
        </section>
      </main>
    </div>

<script src="../js/script.js"></script>
  </body>
</html>
